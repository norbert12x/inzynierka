<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Przegląd zdjęć</title>
<!-- Narzędzie tylko dla Development: adres /dev/zdjecia (Program.cs), korzysta z /api/dev/photos/*.
     Docelowo zastąpi je panel administratora (E6.6). -->
<style>
  :root { --bg:#f6f6f3; --card:#fff; --text:#1d1d1b; --muted:#6b6b66; --line:#deded8;
          --ok:#1f7a3f; --bad:#b3261e; --accent:#2457a6; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 system-ui, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; gap:16px; align-items:center; flex-wrap:wrap; padding:12px 20px; background:var(--card); border-bottom:1px solid var(--line); }
  header h1 { font-size:18px; margin:0 12px 0 0; }
  .tab { border:1px solid var(--line); background:none; padding:6px 12px; border-radius:6px; cursor:pointer; font:inherit; }
  .tab[aria-selected="true"] { background:var(--text); color:#fff; border-color:var(--text); }
  main { max-width:1100px; margin:0 auto; padding:20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
  .place { display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; align-items:baseline; margin-bottom:12px; }
  .place h2 { margin:0; font-size:20px; }
  .muted { color:var(--muted); }
  .badge { display:inline-block; font-size:12px; padding:2px 8px; border-radius:99px; background:var(--bg); border:1px solid var(--line); margin-left:6px; }
  .photo { display:flex; align-items:center; justify-content:center; background:#222; border-radius:8px; min-height:320px; max-height:65vh; overflow:hidden; }
  .photo img { max-width:100%; max-height:65vh; display:block; }
  .photo .missing { color:#ddd; padding:40px; text-align:center; }
  .meta { margin:12px 0; display:grid; grid-template-columns:max-content 1fr; gap:4px 12px; }
  .meta dt { color:var(--muted); }
  .meta dd { margin:0; overflow-wrap:anywhere; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  button.act { font:inherit; padding:10px 16px; border-radius:8px; border:1px solid var(--line); background:var(--card); cursor:pointer; }
  button.act:disabled { opacity:.5; cursor:default; }
  button.approve { background:var(--ok); color:#fff; border-color:var(--ok); }
  button.reject { background:var(--bad); color:#fff; border-color:var(--bad); }
  kbd { font-size:12px; border:1px solid currentColor; border-radius:4px; padding:0 4px; margin-left:6px; opacity:.8; }
  .thumbs { display:flex; gap:6px; flex-wrap:wrap; margin-top:12px; }
  .thumbs button { padding:0; border:2px solid transparent; border-radius:6px; background:none; cursor:pointer; }
  .thumbs button[aria-current="true"] { border-color:var(--accent); }
  .thumbs img { width:72px; height:54px; object-fit:cover; border-radius:4px; display:block; background:#ccc; }
  table { width:100%; border-collapse:collapse; background:var(--card); }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); }
  #toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:var(--text); color:#fff; padding:10px 16px; border-radius:8px; display:none; max-width:90vw; }
  #toast.error { background:var(--bad); }
  .browse-bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
  .browse-bar select { font:inherit; padding:6px; max-width:420px; }
  .group h3 { font-size:15px; margin:18px 0 8px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:12px; }
  .ph { background:var(--card); border:1px solid var(--line); border-radius:8px; overflow:hidden; display:flex; flex-direction:column; }
  .ph.primary { border:2px solid var(--ok); }
  .ph img { width:100%; height:170px; object-fit:cover; display:block; background:#ccc; }
  .ph .nofile { height:170px; display:flex; align-items:center; justify-content:center; background:#333; color:#ddd; font-size:13px; }
  .ph .body { padding:8px; font-size:13px; flex:1; }
  .ph .btns { display:flex; gap:4px; flex-wrap:wrap; padding:0 8px 8px; }
  .ph .btns button { font:inherit; font-size:12px; padding:4px 8px; border-radius:6px; border:1px solid var(--line); background:var(--card); cursor:pointer; }
  .ph .btns .ok { background:var(--ok); color:#fff; border-color:var(--ok); }
  .ph .btns .bad { background:var(--bad); color:#fff; border-color:var(--bad); }
  details summary { cursor:pointer; margin-top:18px; font-weight:600; }
  .badge.exhibit { background:#fff3d6; border-color:#e6c46a; }
  .skipped-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:12px; }
  .skipped-grid figure { margin:0; background:var(--card); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .skipped-grid img { width:100%; height:150px; object-fit:cover; display:block; background:#ccc; }
  .skipped-grid figcaption { padding:8px; font-size:13px; }
  .skipped-grid .reason { color:var(--bad); }
  input[type=search] { font:inherit; padding:6px 10px; border:1px solid var(--line); border-radius:6px; min-width:220px; }
</style>
</head>
<body>
<header>
  <h1>Przegląd zdjęć</h1>
  <button class="tab" id="tab-pending" aria-selected="true">Propozycje (<span id="count-pending">…</span>)</button>
  <button class="tab" id="tab-places" aria-selected="false">Miejsca (<span id="count-places">…</span> bez zdjęcia)</button>
  <button class="tab" id="tab-browse" aria-selected="false">Atrakcje – wszystkie zdjęcia</button>
  <span class="muted" id="summary"></span>
</header>

<main>
  <section id="view-pending">
    <div class="card" id="pending-card"><p class="muted">Ładowanie…</p></div>
  </section>

  <section id="view-places" hidden>
    <p><input type="search" id="filter" placeholder="Filtruj po nazwie lub miejscowości">
      <label style="margin-left:12px"><input type="checkbox" id="only-missing" checked> tylko bez zdjęcia</label>
      <label style="margin-left:12px"><input type="checkbox" id="only-museums"> tylko muzea</label></p>
    <table>
      <thead><tr><th>Atrakcja</th><th>Miejscowość</th><th>Status</th><th>Zdjęcia</th><th>Wnętrza i eksponaty</th><th>Propozycje</th><th></th></tr></thead>
      <tbody id="places-body"></tbody>
    </table>
  </section>

  <section id="view-browse" hidden>
    <div class="browse-bar">
      <button class="act" id="browse-prev">← Poprzednia</button>
      <select id="browse-select" aria-label="Wybierz atrakcję"></select>
      <button class="act" id="browse-next">Następna →</button>
      <span class="muted" id="browse-pos"></span>
      <input type="search" id="browse-filter" placeholder="Filtruj listę">
      <label><input type="checkbox" id="browse-only-photos"> tylko z jakimkolwiek zdjęciem</label>
    </div>
    <div class="card" id="browse-card"><p class="muted">Wybierz atrakcję.</p></div>
  </section>

  <section id="skipped" hidden>
    <h2 style="font-size:17px;margin:24px 0 4px">Pominięte przy ostatnim wyszukiwaniu: <span id="skipped-place"></span></h2>
    <p class="muted" style="margin:0 0 12px">Tylko podgląd prosto z Wikimedia – nic nie jest zapisywane. Tych plików nie publikujemy (powód pod miniaturą).
      <button class="act" id="skipped-close" style="padding:4px 10px;margin-left:8px">Ukryj</button></p>
    <div class="skipped-grid" id="skipped-grid"></div>
  </section>
</main>

<div id="toast" role="status"></div>

<script>
const state = { pending: [], places: [], index: 0, last: null, busy: false };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function toast(text, error = false) {
  const t = $("toast");
  t.textContent = text;
  t.className = error ? "error" : "";
  t.style.display = "block";
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.style.display = "none", error ? 7000 : 4000);
}

async function api(url, options = {}) {
  const response = await fetch(url, { headers: { "Content-Type": "application/json" }, ...options });
  const body = response.headers.get("content-type")?.includes("json") ? await response.json() : null;
  if (!response.ok) throw new Error(body?.title ?? `HTTP ${response.status}`);
  return body;
}

async function load(keepPlaceId) {
  const queue = await api("/api/dev/photos/queue");
  state.pending = queue.pending;
  state.places = queue.places;
  const i = keepPlaceId ? state.pending.findIndex(p => p.placeId === keepPlaceId) : -1;
  state.index = i >= 0 ? i : Math.min(state.index, Math.max(state.pending.length - 1, 0));
  render();
}

function render() {
  $("count-pending").textContent = state.pending.length;
  $("count-places").textContent = state.places.filter(p => p.approvedPhotos === 0).length;
  const missing = state.pending.filter(p => !p.fileExists).length;
  $("summary").textContent = missing ? `${missing} propozycji bez pliku na dysku` : "";
  renderPending();
  renderPlaces();
}

function renderPending() {
  const card = $("pending-card");
  if (state.pending.length === 0) {
    card.innerHTML = `<p>Brak propozycji do przeglądu. Przejdź do zakładki „Miejsca” i wyszukaj nowe.</p>`;
    return;
  }
  const p = state.pending[state.index];
  const samePlace = state.pending.filter(x => x.placeId === p.placeId);
  const osm = `https://www.openstreetmap.org/?mlat=${p.latitude}&mlon=${p.longitude}#map=18/${p.latitude}/${p.longitude}`;
  card.innerHTML = `
    <div class="place">
      <h2>${esc(p.placeName)}<span class="badge">${esc(p.placeStatus === "awaiting_photo" ? "mural – czeka na zdjęcie" : "aktywna")}</span>
        <span class="badge ${p.kind === "exhibit" ? "exhibit" : ""}">${p.kind === "exhibit" ? "wnętrze / eksponat" : "zdjęcie miejsca"}</span>
        <span class="badge">zatwierdzone tego rodzaju: ${p.approvedCount}</span></h2>
      <span class="muted">${esc(p.city)} · <a href="${osm}" target="_blank" rel="noopener">mapa</a> ·
        ${state.index + 1} / ${state.pending.length}</span>
    </div>
    <div class="photo">${p.fileExists
      ? `<img src="${esc(p.imageUrl)}" alt="${esc(p.placeName)}">`
      : `<div class="missing">Brak pliku na dysku.<br><br><button class="act" id="repair">Pobierz brakujące pliki</button></div>`}</div>
    ${samePlace.length > 1 ? `<div class="thumbs" aria-label="Inne propozycje tego miejsca">${samePlace.map(x => `
      <button data-photo="${x.photoId}" aria-current="${x.photoId === p.photoId}" title="${esc(x.sourceFile)}">
        ${x.fileExists ? `<img src="${esc(x.imageUrl)}" alt="" loading="lazy">` : `<img alt="brak pliku">`}</button>`).join("")}</div>` : ""}
    <dl class="meta">
      ${p.caption ? `<dt>Opis</dt><dd>${esc(p.caption)}</dd>` : ""}
      <dt>Autor</dt><dd>${esc(p.author)}</dd>
      <dt>Licencja</dt><dd><a href="${esc(p.licenseUrl)}" target="_blank" rel="noopener">${esc(p.license)}</a></dd>
      <dt>Źródło</dt><dd><a href="${esc(p.sourcePageUrl)}" target="_blank" rel="noopener">${esc(p.sourceFile)}</a></dd>
      <dt>Dopasowanie</dt><dd>${esc(p.matchMethod)}</dd>
    </dl>
    <div class="actions">
      <button class="act approve" id="approve">Zatwierdź<kbd>A</kbd></button>
      <button class="act reject" id="reject">Odrzuć<kbd>R</kbd></button>
      <button class="act" id="skip">Pomiń<kbd>S</kbd></button>
      <button class="act" id="back">Poprzednie<kbd>←</kbd></button>
      <button class="act" id="more">Szukaj więcej zdjęć tego miejsca</button>
      <button class="act" id="open-browse">Wszystkie zdjęcia atrakcji</button>
      <button class="act" id="more-exhibits">Szukaj wnętrz i eksponatów</button>
      <button class="act" id="undo" ${state.last ? "" : "disabled"}>Cofnij ostatnią decyzję<kbd>U</kbd></button>
    </div>`;
  $("approve").onclick = () => decide("approved");
  $("reject").onclick = () => decide("rejected");
  $("skip").onclick = () => move(1);
  $("back").onclick = () => move(-1);
  $("more").onclick = () => findCandidates(p.placeId, p.placeName, "place");
  $("more-exhibits").onclick = () => findCandidates(p.placeId, p.placeName, "exhibit");
  $("open-browse").onclick = () => openBrowse(p.placeId);
  $("undo").onclick = undo;
  $("repair")?.addEventListener("click", repair);
  card.querySelectorAll(".thumbs button").forEach(b => b.onclick = () => {
    state.index = state.pending.findIndex(x => x.photoId === b.dataset.photo);
    renderPending();
  });
}

function renderPlaces() {
  const filter = $("filter").value.trim().toLowerCase();
  const onlyMissing = $("only-missing").checked, onlyMuseums = $("only-museums").checked;
  const rows = state.places.filter(p => (!filter || `${p.name} ${p.city ?? ""}`.toLowerCase().includes(filter))
    && (!onlyMissing || p.approvedPhotos === 0) && (!onlyMuseums || p.isMuseum));
  $("places-body").innerHTML = rows.map(p => `
    <tr><td>${esc(p.name)}${p.isMuseum ? ' <span class="badge">muzeum</span>' : ""}</td><td>${esc(p.city)}</td>
      <td>${p.status === "awaiting_photo" ? "mural" : "aktywna"}</td>
      <td>${p.approvedPhotos}</td><td>${p.approvedExhibits}</td><td>${p.pendingCount}</td>
      <td><button class="act" data-place="${p.placeId}" data-name="${esc(p.name)}" data-kind="place">Szukaj zdjęć</button>
        <button class="act" data-place="${p.placeId}" data-name="${esc(p.name)}" data-kind="exhibit">Szukaj wnętrz i eksponatów</button>
        <button class="act" data-place="${p.placeId}" data-browse="1">Wszystkie zdjęcia</button></td></tr>`).join("");
  $("places-body").querySelectorAll("button").forEach(b => b.onclick = () => b.dataset.browse
    ? openBrowse(b.dataset.place)
    : findCandidates(b.dataset.place, b.dataset.name, b.dataset.kind));
}

function move(step) {
  if (state.pending.length === 0) return;
  state.index = (state.index + step + state.pending.length) % state.pending.length;
  renderPending();
}

async function decide(status) {
  if (state.busy || state.pending.length === 0) return;
  const p = state.pending[state.index];
  state.busy = true;
  try {
    await api(`/api/dev/photos/${p.photoId}/review`, { method: "POST", body: JSON.stringify({ status }) });
    state.last = p;
    toast(status === "approved" ? `Zatwierdzono: ${p.placeName}` : `Odrzucono: ${p.placeName}`);
    await load(p.placeId);
  } catch (e) { toast(e.message, true); }
  finally { state.busy = false; }
}

async function undo() {
  if (!state.last || state.busy) return;
  state.busy = true;
  try {
    await api(`/api/dev/photos/${state.last.photoId}/review`, { method: "POST", body: JSON.stringify({ status: "pending_review" }) });
    toast(`Cofnięto decyzję: ${state.last.placeName}`);
    const id = state.last.photoId;
    state.last = null;
    await load();
    state.index = Math.max(state.pending.findIndex(x => x.photoId === id), 0);
    renderPending();
  } catch (e) { toast(e.message, true); }
  finally { state.busy = false; }
}

async function findCandidates(placeId, name, kind = "place") {
  if (state.busy) return;
  state.busy = true;
  const what = kind === "exhibit" ? "wnętrz i eksponatów" : "zdjęć";
  toast(`Szukam ${what}: ${name}…`);
  try {
    const r = await api(`/api/dev/attractions/${placeId}/photo-candidates?limit=5&radiusMeters=50&kind=${kind}`, { method: "POST" });
    const where = r.commonsCategory ? ` (kategoria Commons: ${r.commonsCategory})` : "";
    toast(`${name}: dodano ${r.added.length}, pominięto ${r.skipped.length}, znane wcześniej ${r.alreadyKnown}${where}`
      + (r.note && r.added.length === 0 ? ` – ${r.note}` : ""), r.added.length === 0 && !!r.note);
    renderSkipped(name, r.skipped);
    await load(placeId);
    if (!$("view-browse").hidden) await loadBrowse();
    else if (r.added.length) showTab("pending");
  } catch (e) { toast(e.message, true); }
  finally { state.busy = false; }
}

function renderSkipped(name, skipped) {
  $("skipped").hidden = skipped.length === 0;
  $("skipped-place").textContent = `${name} (${skipped.length})`;
  $("skipped-grid").innerHTML = skipped.map(s => `
    <figure>
      <a href="${esc(s.sourcePageUrl)}" target="_blank" rel="noopener"><img src="${esc(s.thumbnailUrl)}" alt="" loading="lazy"></a>
      <figcaption>
        <div><a href="${esc(s.sourcePageUrl)}" target="_blank" rel="noopener">${esc(s.sourceFile.replace(/^File:/, ""))}</a></div>
        <div class="muted">${esc(s.license || "brak licencji w metadanych")}${s.author ? " · " + esc(s.author) : ""}</div>
        <div class="reason">${esc(s.reason)}</div>
      </figcaption>
    </figure>`).join("");
}

async function repair() {
  if (state.busy) return;
  state.busy = true;
  toast("Pobieram brakujące pliki – to może potrwać…");
  try {
    const r = await api("/api/dev/photos/repair?dryRun=false&limit=200", { method: "POST" });
    toast(`Pobrano ${r.downloaded}, błędy ${r.failed}, zostało ${r.remaining}`, r.failed > 0);
    await load();
  } catch (e) { toast(e.message, true); }
  finally { state.busy = false; }
}

function showTab(name) {
  for (const tab of ["pending", "places", "browse"]) {
    $("view-" + tab).hidden = name !== tab;
    $("tab-" + tab).setAttribute("aria-selected", name === tab);
  }
  if (name === "browse") renderBrowseList();
}

// --- Atrakcje: wszystkie zdjęcia jednej atrakcji, z możliwością zmiany każdej decyzji ---
const browse = { ids: [], index: 0, data: null };

function browseCandidates() {
  const filter = $("browse-filter").value.trim().toLowerCase();
  const onlyPhotos = $("browse-only-photos").checked;
  return state.places.filter(p => (!filter || `${p.name} ${p.city ?? ""}`.toLowerCase().includes(filter))
    && (!onlyPhotos || p.approvedPhotos + p.approvedExhibits + p.pendingCount > 0));
}

function renderBrowseList() {
  const list = browseCandidates();
  const current = browse.ids[browse.index];
  browse.ids = list.map(p => p.placeId);
  browse.index = Math.max(browse.ids.indexOf(current), 0);
  $("browse-select").innerHTML = list.map(p => `<option value="${p.placeId}">${esc(p.name)} – ${esc(p.city)}
    (${p.approvedPhotos} zdj., ${p.approvedExhibits} wn./eksp., ${p.pendingCount} prop.)</option>`).join("");
  $("browse-select").value = browse.ids[browse.index] ?? "";
  $("browse-pos").textContent = browse.ids.length ? `${browse.index + 1} / ${browse.ids.length}` : "brak atrakcji";
  if (browse.ids.length && browse.data?.placeId !== browse.ids[browse.index]) loadBrowse();
}

async function openBrowse(placeId) {
  $("browse-filter").value = "";
  $("browse-only-photos").checked = false;
  browse.ids = browseCandidates().map(p => p.placeId);
  browse.index = Math.max(browse.ids.indexOf(placeId), 0);
  showTab("browse");
}

function browseMove(step) {
  if (!browse.ids.length) return;
  browse.index = (browse.index + step + browse.ids.length) % browse.ids.length;
  renderBrowseList();
}

async function loadBrowse() {
  const id = browse.ids[browse.index];
  if (!id) return;
  try {
    browse.data = await api(`/api/dev/attractions/${id}/photos`);
    renderBrowse();
  } catch (e) { toast(e.message, true); }
}

function photoCard(ph) {
  const statusLabel = { approved: "zatwierdzone", pending_review: "propozycja", rejected: "odrzucone" }[ph.status];
  const btn = (action, label, cls = "") => `<button class="${cls}" data-photo="${ph.photoId}" data-action="${action}">${label}</button>`;
  const buttons = [
    ph.status === "approved" && !ph.isPrimary ? btn("primary", ph.kind === "exhibit" ? "Ustaw jako pierwsze" : "Ustaw jako główne", "ok") : "",
    ph.status !== "approved" ? btn("approved", "Zatwierdź", "ok") : "",
    ph.status !== "rejected" ? btn("rejected", "Odrzuć", "bad") : "",
    ph.status !== "pending_review" ? btn("pending_review", "Do przeglądu") : "",
    btn(ph.kind === "exhibit" ? "kind-place" : "kind-exhibit", ph.kind === "exhibit" ? "→ zdjęcie miejsca" : "→ wnętrze/eksponat")
  ].join("");
  return `<div class="ph ${ph.isPrimary ? "primary" : ""}">
    ${ph.fileExists ? `<a href="${esc(ph.imageUrl)}" target="_blank" rel="noopener"><img src="${esc(ph.imageUrl)}" alt="" loading="lazy"></a>`
      : `<div class="nofile">brak pliku na dysku</div>`}
    <div class="body">
      ${ph.isPrimary ? `<span class="badge" style="border-color:var(--ok)">${ph.kind === "exhibit" ? "pierwsze" : "główne"}</span>` : ""}
      <span class="badge">${statusLabel}</span>
      ${ph.kind === "exhibit" ? '<span class="badge exhibit">wnętrze / eksponat</span>' : ""}
      ${ph.caption ? `<div style="margin-top:4px">${esc(ph.caption)}</div>` : ""}
      <div class="muted" style="margin-top:4px">${esc(ph.author)} · <a href="${esc(ph.licenseUrl)}" target="_blank" rel="noopener">${esc(ph.license)}</a>
        · <a href="${esc(ph.sourcePageUrl)}" target="_blank" rel="noopener">źródło</a></div>
    </div>
    <div class="btns">${buttons}</div>
  </div>`;
}

function renderBrowse() {
  const d = browse.data;
  if (!d) return;
  const osm = `https://www.openstreetmap.org/?mlat=${d.latitude}&mlon=${d.longitude}#map=18/${d.latitude}/${d.longitude}`;
  const by = (status, kind) => d.photos.filter(p => p.status === status && (kind === undefined || p.kind === kind));
  const group = (title, items, empty) => `<div class="group"><h3>${title} (${items.length})</h3>
    ${items.length ? `<div class="grid">${items.map(photoCard).join("")}</div>` : `<p class="muted">${empty}</p>`}</div>`;
  const rejected = by("rejected");
  $("browse-card").innerHTML = `
    <div class="place">
      <h2>${esc(d.name)}<span class="badge">${d.status === "awaiting_photo" ? "mural – czeka na zdjęcie" : d.status === "active" ? "aktywna" : esc(d.status)}</span>
        ${d.isMuseum ? '<span class="badge">muzeum</span>' : ""}</h2>
      <span class="muted">${esc(d.city)} · <a href="${osm}" target="_blank" rel="noopener">mapa</a> ·
        ${d.commonsHint ? `Wikidata <a href="https://www.wikidata.org/wiki/${esc(d.commonsHint)}" target="_blank" rel="noopener">${esc(d.commonsHint)}</a>` : "brak powiązania Wikidata"}</span>
    </div>
    <div class="actions" style="margin-top:0">
      <button class="act" id="browse-more">Szukaj zdjęć</button>
      <button class="act" id="browse-exhibits">Szukaj wnętrz i eksponatów</button>
    </div>
    ${group("Zatwierdzone – zdjęcia miejsca", by("approved", "place"), "Brak – atrakcja nie ma jeszcze zdjęcia.")}
    ${group("Zatwierdzone – wnętrza i eksponaty", by("approved", "exhibit"), "Brak.")}
    ${group("Propozycje do przeglądu", by("pending_review"), "Brak propozycji.")}
    <details ${rejected.length && rejected.length <= 6 ? "open" : ""}><summary>Odrzucone (${rejected.length})</summary>
      ${rejected.length ? `<div class="grid" style="margin-top:8px">${rejected.map(photoCard).join("")}</div>` : '<p class="muted">Brak.</p>'}</details>`;
  $("browse-more").onclick = () => findCandidates(d.placeId, d.name, "place");
  $("browse-exhibits").onclick = () => findCandidates(d.placeId, d.name, "exhibit");
  $("browse-card").querySelectorAll("button[data-action]").forEach(b => b.onclick = () => browseAction(b.dataset.photo, b.dataset.action));
}

async function browseAction(photoId, action) {
  if (state.busy) return;
  state.busy = true;
  try {
    if (action === "primary")
      await api(`/api/dev/photos/${photoId}/primary`, { method: "POST" });
    else {
      const body = action.startsWith("kind-") ? { kind: action.slice(5) } : { status: action };
      await api(`/api/dev/photos/${photoId}/review`, { method: "POST", body: JSON.stringify(body) });
    }
    toast({ primary: "Ustawiono jako główne", approved: "Zatwierdzono", rejected: "Odrzucono",
      pending_review: "Przeniesiono do przeglądu", "kind-place": "Teraz: zdjęcie miejsca", "kind-exhibit": "Teraz: wnętrze / eksponat" }[action]);
    await load();
    await loadBrowse();
  } catch (e) { toast(e.message, true); }
  finally { state.busy = false; }
}

$("tab-pending").onclick = () => showTab("pending");
$("tab-places").onclick = () => showTab("places");
$("tab-browse").onclick = () => showTab("browse");
$("browse-prev").onclick = () => browseMove(-1);
$("browse-next").onclick = () => browseMove(1);
$("browse-select").onchange = () => { browse.index = browse.ids.indexOf($("browse-select").value); renderBrowseList(); };
$("browse-filter").oninput = renderBrowseList;
$("browse-only-photos").onchange = renderBrowseList;
$("filter").oninput = renderPlaces;
$("only-missing").onchange = renderPlaces;
$("only-museums").onchange = renderPlaces;
$("skipped-close").onclick = () => $("skipped").hidden = true;
document.addEventListener("keydown", e => {
  if (["INPUT", "SELECT"].includes(e.target.tagName) || e.ctrlKey || e.metaKey || e.altKey) return;
  if (!$("view-browse").hidden) {
    if (e.key === "ArrowLeft") browseMove(-1);
    else if (e.key === "ArrowRight") browseMove(1);
    return;
  }
  if ($("view-pending").hidden) return;
  const key = e.key.toLowerCase();
  if (key === "a") decide("approved");
  else if (key === "r") decide("rejected");
  else if (key === "s" || e.key === "ArrowRight") move(1);
  else if (e.key === "ArrowLeft") move(-1);
  else if (key === "u") undo();
});

load().catch(e => {
  $("pending-card").innerHTML = `<p>Nie udało się wczytać kolejki: ${esc(e.message)}</p>
    <p class="muted">Strona działa tylko po uruchomieniu aplikacji w Development.</p>`;
});
</script>
</body>
</html>
